# 《改写人生剧本》— Netlify config (feature/redeem-codes)
# Deploy Preview first; do NOT overwrite production until Jay approves.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_shared/**"]

# API → Functions (must be BEFORE SPA fallback; force=true wins over static)
[[redirects]]
  from = "/api/redeem/activate"
  to = "/.netlify/functions/redeem-activate"
  status = 200
  force = true

[[redirects]]
  from = "/api/redeem/session"
  to = "/.netlify/functions/redeem-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/void"
  to = "/.netlify/functions/admin-void"
  status = 200
  force = true

# SPA fallback for client routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
