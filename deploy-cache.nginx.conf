# Example nginx snippet for static hosting of Vite dist/
# HTML: always revalidate. Hashed /assets/*: long cache.
location = /index.html {
  add_header Cache-Control "public, max-age=0, must-revalidate";
}
location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  gzip_static on;
}
location ~* \.(webp|png|svg|ico)$ {
  add_header Cache-Control "public, max-age=31536000, immutable";
}
# Optional gzip for text
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
